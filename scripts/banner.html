<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  body { font-family: system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }

  .banner {
    position: relative; width: 1280px; height: 560px; border-radius: 28px; overflow: hidden;
    background:
      radial-gradient(420px 420px at 16% 36%, rgba(120, 170, 255, 0.45), rgba(120, 170, 255, 0)),
      linear-gradient(180deg, #2f73f0, #17338a);
  }

  .intro { position: absolute; left: 84px; top: 84px; color: #fff; }
  .intro img { width: 132px; height: 132px; display: block; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35)); }
  .intro h1 { margin-top: 26px; font-size: 76px; font-weight: 700; letter-spacing: -1.8px; line-height: 1; }
  .intro p { margin-top: 14px; font-size: 27px; line-height: 1.3; color: rgba(255, 255, 255, 0.78); }
  .chips { margin-top: 26px; display: flex; gap: 10px; }
  .chips span {
    font-size: 16px; font-weight: 600; color: rgba(255, 255, 255, 0.92); padding: 7px 14px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.18);
  }

  .window {
    position: absolute; left: 580px; top: 92px; width: 860px; height: 620px;
    border-radius: 12px; overflow: hidden; background: #0d1117;
    box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.4), 0 40px 90px rgba(5, 10, 60, 0.55), 0 12px 30px rgba(5, 10, 60, 0.3);
  }
  .chrome { height: 74px; background: #1f2329; border-bottom: 1px solid #2b3036; position: relative; }
  .lights { position: absolute; left: 14px; top: 13px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; }
  .tab {
    position: absolute; left: 82px; top: 6px; width: 220px; height: 30px; border-radius: 8px 8px 0 0; background: #2b3036;
    display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #e6edf3; font-size: 12.5px;
  }
  .tab svg { flex: none; }
  .omnibox {
    position: absolute; left: 82px; right: 70px; top: 42px; height: 24px; border-radius: 12px; background: #2b3036;
    display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #c9d1d9; font-size: 12.5px;
  }
  .ext { position: absolute; right: 30px; top: 43px; width: 22px; height: 22px; }
  .shot { display: block; width: 860px; }
</style>
</head>
<body>
<div class="banner">
  <div class="intro">
    <img src="../icons/icon.svg" alt="">
    <h1>GitHub Home</h1>
    <p>Your repositories on the<br>GitHub home page, not the feed.</p>
    <div class="chips"><span>Most used</span><span>Getting traction</span><span>Type to jump</span></div>
  </div>

  <div class="window">
    <div class="chrome">
      <div class="lights"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div>
      <div class="tab">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="#e6edf3"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
        GitHub
      </div>
      <div class="omnibox">
        <svg width="11" height="13" viewBox="0 0 11 13"><rect x="1" y="5.5" width="9" height="6.5" rx="1.5" fill="#8b949e"/><path d="M3 5.5V4a2.5 2.5 0 0 1 5 0v1.5" fill="none" stroke="#8b949e" stroke-width="1.4"/></svg>
        github.com
      </div>
      <img class="ext" src="../icons/icon.svg" alt="">
    </div>
    <img class="shot" src="../docs/screenshot-dark.png" alt="">
  </div>
</div>
</body>
</html>
